name: Build Signed Financial Monitoring APK

on:
  workflow_dispatch:

jobs:
  build-signed:
    runs-on: ubuntu-latest
    env:
      FM_KEYSTORE_BASE64: ${{ secrets.FM_KEYSTORE_BASE64 }}
      FM_KEYSTORE_PASSWORD: ${{ secrets.FM_KEYSTORE_PASSWORD }}
      FM_KEY_ALIAS: ${{ secrets.FM_KEY_ALIAS }}
      FM_KEY_PASSWORD: ${{ secrets.FM_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify signing secrets
        shell: bash
        run: |
          if [ -z "$FM_KEYSTORE_BASE64" ] || [ -z "$FM_KEYSTORE_PASSWORD" ] || [ -z "$FM_KEY_ALIAS" ] || [ -z "$FM_KEY_PASSWORD" ]; then
            echo "::error::Signed APK secrets are not configured. See SIGNING_SETUP.md."
            exit 1
          fi

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Decode signing key
        shell: bash
        run: |
          printf '%s' "$FM_KEYSTORE_BASE64" | base64 --decode > financial-monitoring-release.jks

      - name: Validate and build unsigned release APK
        run: |
          gradle --no-daemon :app:lintRelease
          gradle --no-daemon :app:assembleRelease

      - name: Align and sign APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             "FinancialMonitoring-${APP_VERSION}-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks financial-monitoring-release.jks             --ks-key-alias "$FM_KEY_ALIAS"             --ks-pass env:FM_KEYSTORE_PASSWORD             --key-pass env:FM_KEY_PASSWORD             --out "FinancialMonitoring-${APP_VERSION}-signed.apk"             "FinancialMonitoring-${APP_VERSION}-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose --print-certs             "FinancialMonitoring-${APP_VERSION}-signed.apk"

      - name: Remove temporary signing key
        if: always()
        run: rm -f financial-monitoring-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancialMonitoring-${{ env.APP_VERSION }}-signed-apk
          path: FinancialMonitoring-${{ env.APP_VERSION }}-signed.apk
